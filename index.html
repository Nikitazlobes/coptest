<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-opt EST Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-secondary: #2a2a2a;
            --accent: #0088cc;
            --accent-hover: #0077b3;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --danger: #e53935;
            --success: #4caf50;
            --border-radius: 12px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 90px;
        }

        header {
            padding: 15px;
            background-color: var(--card-bg);
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .user-info-bar {
            background: var(--card-secondary);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .user-info-bar span {
            color: #fff;
            font-weight: bold;
        }

        .search-box {
            width: 100%;
            padding: 10px;
            border-radius: var(--border-radius);
            border: 1px solid #333;
            background-color: var(--card-secondary);
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 12px;
        }

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: none;
        }

        .category-btn {
            background-color: var(--card-secondary);
            border: none;
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            font-size: 13px;
        }

        .category-btn.active {
            background-color: var(--accent);
            color: white;
            font-weight: bold;
        }

        .container {
            padding: 15px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (min-width: 600px) {
            .products-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .product-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            background-color: var(--card-secondary);
        }

        .product-title {
            font-size: 14px;
            font-weight: 600;
            margin: 8px 0 4px 0;
            line-height: 1.2;
        }

        .product-category {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .product-price {
            font-size: 15px;
            font-weight: bold;
            color: var(--accent);
        }

        .product-stock {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .add-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .cart-bar {
            position: fixed;
            bottom: 15px;
            left: 15px;
            right: 15px;
            background-color: var(--accent);
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,136,204,0.4);
            cursor: pointer;
            font-weight: bold;
            z-index: 99;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            padding: 15px;
            overflow-y: auto;
        }

        .modal-content {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            max-width: 500px;
            margin: 20px auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }

        .qty-controls button {
            background-color: #333;
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .admin-section {
            background: var(--card-secondary);
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .admin-section h4 {
            margin: 0 0 10px 0;
            color: var(--accent);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 10px;
            text-align: center;
        }

        .stat-box {
            background: #1e1e1e;
            padding: 8px;
            border-radius: 8px;
        }

        .stat-box div:first-child {
            font-size: 10px;
            color: var(--text-secondary);
        }

        .stat-box div:last-child {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            margin-top: 4px;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1e1e1e;
            color: white;
            box-sizing: border-box;
        }

        .btn-admin {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        .btn-secondary {
            background: #444;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        .admin-prod-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #333;
            font-size: 13px;
        }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <h2 style="margin:0;">🛍 C-opt EST</h2>
        <button id="adminToggleBtn" class="btn-admin" onclick="toggleAdminPanel()">Панель управления</button>
    </div>

    <div class="user-info-bar" id="userInfoBar">
        <div>Заказов: <span id="userOrdersCount">0</span></div>
        <div>Потрачено: <span id="userTotalSpent">0 руб.</span></div>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="Поиск товаров..." oninput="renderProducts()">
    <div class="categories" id="categoriesContainer"></div>
</header>

<div class="container">
    <div class="products-grid" id="productsGrid"></div>
</div>

<!-- Корзина Бар -->
<div id="cartBar" class="cart-bar" style="display: none;" onclick="openCartModal()">
    <span>🛒 Корзина (<span id="cartCount">0</span>)</span>
    <span id="cartTotal">0 руб.</span>
</div>

<!-- Модальное окно корзины -->
<div id="cartModal" class="modal">
    <div class="modal-content">
        <h3>🛒 Ваш заказ</h3>
        <div id="cartItemsList"></div>
        <h3 style="margin-top: 15px; text-align: right;">Итого: <span id="modalCartTotal">0</span> руб.</h3>
        <button class="add-btn" style="margin-top: 15px;" onclick="submitOrder()">Оформить заказ</button>
        <button class="btn-admin" style="width: 100%; margin-top: 8px;" onclick="closeCartModal()">Закрыть</button>
    </div>
</div>

<!-- Модальное окно Админки -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <h3>⚙️ Панель Администратора</h3>

        <!-- 1. Статистика -->
        <div class="admin-section">
            <h4>📊 Статистика продаж</h4>
            <div class="stats-grid">
                <div class="stat-box">
                    <div>Выручка</div>
                    <div id="statRevenue">0 ₽</div>
                </div>
                <div class="stat-box">
                    <div>Продано</div>
                    <div id="statItems">0 шт.</div>
                </div>
                <div class="stat-box">
                    <div>Заказы</div>
                    <div id="statOrders">0</div>
                </div>
            </div>
            <div style="display: flex; gap: 8px;">
                <button class="btn-secondary" onclick="editStats()">Изменить</button>
                <button class="btn-danger" onclick="clearStats()">Сбросить</button>
            </div>
        </div>

        <!-- 2. Рассылка клиентам -->
        <div class="admin-section">
            <h4>📢 Рассылка клиентам</h4>
            <div class="input-group">
                <textarea id="broadcastText" rows="3" placeholder="Введите текст сообщения (например: 🔥 Внимание, пришла новая поставка!)..."></textarea>
            </div>
            <button class="add-btn" onclick="sendBroadcast()">Отправить рассылку</button>
        </div>

        <!-- 3. Импорт PDF -->
        <div class="admin-section">
            <h4>📄 Импорт накладной (PDF)</h4>
            <div class="input-group">
                <input type="file" id="pdfFileInput" accept=".pdf">
            </div>
            <div class="input-group">
                <label>Наценка на каждую позицию (руб.):</label>
                <input type="number" id="pdfMarkupInput" value="100">
            </div>
            <button class="add-btn" onclick="uploadPDF()">Загрузить и обработать</button>
        </div>

        <!-- 4. Добавление / Редактирование товара -->
        <div class="admin-section">
            <h4 id="formTitle">➕ Добавить товар</h4>
            <input type="hidden" id="editProductId">
            <div class="input-group">
                <label>Название товара:</label>
                <input type="text" id="prodName">
            </div>
            <div class="input-group">
                <label>Категория:</label>
                <select id="prodCategory">
                    <option value="Жидкости">Жидкости</option>
                    <option value="Картриджи и Испарители">Картриджи и Испарители</option>
                    <option value="Устройства">Устройства</option>
                    <option value="Одноразки">Одноразки</option>
                    <option value="Разное">Разное</option>
                </select>
            </div>
            <div class="input-group">
                <label>Цена (руб.):</label>
                <input type="number" id="prodPrice">
            </div>
            <div class="input-group">
                <label>Количество (шт.):</label>
                <input type="number" id="prodQty">
            </div>
            <div class="input-group">
                <label>Изображение (URL или Загрузить файл):</label>
                <input type="text" id="prodImage" placeholder="https://... или загрузите файл ниже">
                <input type="file" id="prodImageFile" accept="image/*" style="margin-top: 5px;" onchange="uploadProductImage()">
            </div>
            <button class="add-btn" id="saveProdBtn" onclick="saveProduct()">Сохранить товар</button>
            <button class="btn-admin" id="cancelEditBtn" style="width: 100%; margin-top: 5px; display: none;" onclick="resetProductForm()">Отмена редактирования</button>
        </div>

        <!-- 5. Список всех товаров -->
        <div class="admin-section">
            <h4>📦 Управление товарами</h4>
            <div id="adminProductsList" style="max-height: 250px; overflow-y: auto;"></div>
        </div>

        <button class="btn-admin" style="width: 100%; padding: 10px;" onclick="closeAdminPanel()">Закрыть панель</button>
    </div>
</div>

<script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    const currentUser = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
    const currentUserId = currentUser ? currentUser.id : 1318983685;

    let allProducts = [];
    let cart = [];
    let currentCategory = 'Все';

    const categoriesList = ['Все', 'Жидкости', 'Картриджи и Испарители', 'Устройства', 'Одноразки', 'Разное'];

    async function initApp() {
        await loadUserStats();
        await loadProducts();
    }

    async function loadUserStats() {
        try {
            const res = await fetch(`/api/user-stats?user_id=${currentUserId}`);
            const data = await res.json();
            document.getElementById('userOrdersCount').innerText = data.orders_count || 0;
            document.getElementById('userTotalSpent').innerText = (data.total_spent || 0) + ' руб.';
        } catch (e) {
            console.error('Ошибка загрузки статистики пользователя:', e);
        }
    }

    async function loadProducts() {
        try {
            const res = await fetch('/api/products');
            allProducts = await res.json();
            renderCategories();
            renderProducts();
            if (document.getElementById('adminModal').style.display === 'block') {
                renderAdminProductsList();
            }
        } catch (e) {
            console.error('Ошибка загрузки товаров:', e);
        }
    }

    function renderCategories() {
        const container = document.getElementById('categoriesContainer');
        container.innerHTML = categoriesList.map(cat => `
            <button class="category-btn ${cat === currentCategory ? 'active' : ''}" 
                    onclick="selectCategory('${cat}')">${cat}</button>
        `).join('');
    }

    function selectCategory(cat) {
        currentCategory = cat;
        renderCategories();
        renderProducts();
    }

    function renderProducts() {
        const grid = document.getElementById('productsGrid');
        const search = document.getElementById('searchInput').value.toLowerCase();

        const filtered = allProducts.filter(p => {
            const matchesCat = (currentCategory === 'Все') || (p.category === currentCategory);
            const matchesSearch = p.name.toLowerCase().includes(search);
            return matchesCat && matchesSearch;
        });

        if (filtered.length === 0) {
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #777; margin-top: 20px;">Товары не найдены</div>';
            return;
        }

        grid.innerHTML = filtered.map(p => `
            <div class="product-card">
                <div>
                    <img src="${p.image_url || 'https://via.placeholder.com/150?text=No+Photo'}" alt="${p.name}">
                    <div class="product-title">${p.name}</div>
                    <div class="product-category">${p.category || 'Разное'}</div>
                </div>
                <div>
                    <div class="product-price">${p.price} руб.</div>
                    <div class="product-stock">В наличии: ${p.quantity} шт.</div>
                    <button class="add-btn" onclick="addToCart(${p.id})">В корзину</button>
                </div>
            </div>
        `).join('');
    }

    function addToCart(productId) {
        const prod = allProducts.find(p => p.id === productId);
        if (!prod || prod.quantity <= 0) return alert('Товара нет в наличии!');

        const existing = cart.find(c => c.id === productId);
        if (existing) {
            if (existing.cartQuantity + 1 > prod.quantity) return alert('Достигнут предел наличия!');
            existing.cartQuantity++;
        } else {
            cart.push({ ...prod, cartQuantity: 1 });
        }
        updateCartUI();
    }

    function updateCartQuantity(id, delta) {
        const item = cart.find(c => c.id === id);
        if (!item) return;

        item.cartQuantity += delta;
        if (item.cartQuantity <= 0) {
            cart = cart.filter(c => c.id !== id);
        }
        updateCartUI();
        renderCartItems();
    }

    function updateCartUI() {
        const totalItems = cart.reduce((sum, item) => sum + item.cartQuantity, 0);
        const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.cartQuantity), 0);

        document.getElementById('cartCount').innerText = totalItems;
        document.getElementById('cartTotal').innerText = totalPrice + ' руб.';
        document.getElementById('cartBar').style.display = totalItems > 0 ? 'flex' : 'none';
    }

    function openCartModal() {
        renderCartItems();
        document.getElementById('cartModal').style.display = 'block';
    }

    function closeCartModal() {
        document.getElementById('cartModal').style.display = 'none';
    }

    function renderCartItems() {
        const container = document.getElementById('cartItemsList');
        const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.cartQuantity), 0);
        document.getElementById('modalCartTotal').innerText = totalPrice;

        if (cart.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#777;">Корзина пуста</p>';
            return;
        }

        container.innerHTML = cart.map(item => `
            <div class="cart-item">
                <div>
                    <div><strong>${item.name}</strong></div>
                    <div style="font-size: 12px; color: #aaa;">${item.price} руб.</div>
                </div>
                <div class="qty-controls" style="display: flex; gap: 8px; align-items: center;">
                    <button onclick="updateCartQuantity(${item.id}, -1)">-</button>
                    <span>${item.cartQuantity}</span>
                    <button onclick="updateCartQuantity(${item.id}, 1)">+</button>
                </div>
            </div>
        `).join('');
    }

    async function submitOrder() {
        if (cart.length === 0) return;

        const payload = {
            user_id: currentUserId,
            username: currentUser ? currentUser.username : 'Гость',
            cart: cart
        };

        const res = await fetch('/api/order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.success) {
            alert('Заказ успешно оформлен!');
            cart = [];
            updateCartUI();
            closeCartModal();
            loadProducts();
            loadUserStats();
        } else {
            alert('Ошибка оформления: ' + data.error);
        }
    }

    // --- АДМИН ПАНЕЛЬ ---

    async function toggleAdminPanel() {
        document.getElementById('adminModal').style.display = 'block';
        await loadAdminStats();
        renderAdminProductsList();
    }

    function closeAdminPanel() {
        document.getElementById('adminModal').style.display = 'none';
        resetProductForm();
    }

    async function loadAdminStats() {
        try {
            const res = await fetch('/api/admin-stats');
            const data = await res.json();
            document.getElementById('statRevenue').innerText = (data.total_revenue || 0) + ' ₽';
            document.getElementById('statItems').innerText = (data.items_sold || 0) + ' шт.';
            document.getElementById('statOrders').innerText = data.total_orders || 0;
        } catch (e) {
            console.error('Ошибка загрузки статистики:', e);
        }
    }

    async function editStats() {
        const total_revenue = prompt("Введите сумму выручки (руб.):");
        if (total_revenue === null) return;
        const items_sold = prompt("Введите количество проданных товаров (шт.):");
        if (items_sold === null) return;
        const total_orders = prompt("Введите общее число заказов:");
        if (total_orders === null) return;

        await fetch('/api/admin-stats/edit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ total_revenue, items_sold, total_orders })
        });
        loadAdminStats();
    }

    async function clearStats() {
        if (!confirm("Сбросить всю статистику продаж в 0?")) return;
        await fetch('/api/admin-stats/clear', { method: 'POST' });
        loadAdminStats();
    }

    async function sendBroadcast() {
        const text = document.getElementById('broadcastText').value.trim();
        if (!text) return alert('Введите текст рассылки!');

        if (!confirm('Отправить сообщение всем клиентам базы?')) return;

        const res = await fetch('/api/broadcast', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
        });

        const data = await res.json();
        if (data.success) {
            alert(`Рассылка завершена!\nУспешно отправлено: ${data.sent}\nНе доставлено: ${data.failed}`);
            document.getElementById('broadcastText').value = '';
        } else {
            alert('Ошибка рассылки: ' + data.error);
        }
    }

    async function uploadPDF() {
        const fileInput = document.getElementById('pdfFileInput');
        const markupInput = document.getElementById('pdfMarkupInput');

        if (!fileInput.files[0]) return alert('Выберите PDF файл накладной!');

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('markup_rubles', markupInput.value);

        const res = await fetch('/api/upload-pdf', {
            method: 'POST',
            body: formData
        });

        const data = await res.json();
        if (data.success) {
            alert(`Накладная успешно загружена! Импортировано/обновлено позиций: ${data.added}`);
            fileInput.value = '';
            loadProducts();
        } else {
            alert('Ошибка импорта: ' + data.error);
        }
    }

    async function uploadProductImage() {
        const fileInput = document.getElementById('prodImageFile');
        if (!fileInput.files[0]) return;

        const formData = new FormData();
        formData.append('image', fileInput.files[0]);

        const res = await fetch('/api/upload-image', {
            method: 'POST',
            body: formData
        });

        const data = await res.json();
        if (data.image_url) {
            document.getElementById('prodImage').value = data.image_url;
            alert('Изображение успешно загружено!');
        } else {
            alert('Ошибка загрузки изображения: ' + (data.error || 'неизвестная ошибка'));
        }
    }

    async function saveProduct() {
        const id = document.getElementById('editProductId').value;
        const name = document.getElementById('prodName').value.trim();
        const category = document.getElementById('prodCategory').value;
        const price = document.getElementById('prodPrice').value;
        const quantity = document.getElementById('prodQty').value;
        const image_url = document.getElementById('prodImage').value.trim();

        if (!name || !price) return alert('Заполните название и цену!');

        const res = await fetch('/api/products', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, name, category, price, quantity, image_url })
        });

        const data = await res.json();
        if (data.success) {
            alert('Товар успешно сохранен!');
            resetProductForm();
            loadProducts();
        } else {
            alert('Ошибка сохранения: ' + data.error);
        }
    }

    function renderAdminProductsList() {
        const container = document.getElementById('adminProductsList');
        if (allProducts.length === 0) {
            container.innerHTML = '<p style="color:#777; font-size: 12px;">Список товаров пуст</p>';
            return;
        }

        container.innerHTML = allProducts.map(p => `
            <div class="admin-prod-item">
                <div style="flex-grow: 1; margin-right: 10px;">
                    <strong>${p.name}</strong>
                    <div style="font-size: 11px; color: #aaa;">${p.price} руб. | ${p.quantity} шт. | ${p.category}</div>
                </div>
                <div style="display: flex; gap: 5px;">
                    <button class="btn-secondary" onclick="editProduct(${p.id})">✏️</button>
                    <button class="btn-danger" onclick="deleteProduct(${p.id})">🗑</button>
                </div>
            </div>
        `).join('');
    }

    function editProduct(id) {
        const prod = allProducts.find(p => p.id === id);
        if (!prod) return;

        document.getElementById('editProductId').value = prod.id;
        document.getElementById('prodName').value = prod.name;
        document.getElementById('prodCategory').value = prod.category || 'Разное';
        document.getElementById('prodPrice').value = prod.price;
        document.getElementById('prodQty').value = prod.quantity;
        document.getElementById('prodImage').value = prod.image_url || '';

        document.getElementById('formTitle').innerText = '✏️ Редактирование товара';
        document.getElementById('saveProdBtn').innerText = 'Обновить товар';
        document.getElementById('cancelEditBtn').style.display = 'block';
    }

    function resetProductForm() {
        document.getElementById('editProductId').value = '';
        document.getElementById('prodName').value = '';
        document.getElementById('prodPrice').value = '';
        document.getElementById('prodQty').value = '';
        document.getElementById('prodImage').value = '';
        document.getElementById('prodImageFile').value = '';

        document.getElementById('formTitle').innerText = '➕ Добавить товар';
        document.getElementById('saveProdBtn').innerText = 'Сохранить товар';
        document.getElementById('cancelEditBtn').style.display = 'none';
    }

    async function deleteProduct(id) {
        if (!confirm('Вы точно хотите удалить этот товар?')) return;

        const res = await fetch('/api/delete-product', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id })
        });

        const data = await res.json();
        if (data.success) {
            loadProducts();
        } else {
            alert('Ошибка при удалении: ' + data.error);
        }
    }

    // Инициализация при старте
    initApp();
</script>
</body>
</html>
