<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Импорт PDF (Локальный запуск)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 30px auto; padding: 20px; background: #121820; color: #fff; }
    .card { background: #1e2630; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #2e3846; }
    input[type="file"] { margin-bottom: 15px; width: 100%; padding: 10px; }
    button { background: #00b4d8; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
    button:hover { background: #0096c7; }
    .status { margin-top: 10px; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #2e3846; padding: 10px; text-align: left; }
    th { background: #161c24; }
  </style>
</head>
<body>
  <h2>Импорт товаров из PDF (Себестоимость)</h2>
  <div class="card">
    <input type="file" id="pdfFile" accept="application/pdf"><br>
    <button onclick="processPdf()">Распознать PDF</button>
    <div id="status" class="status"></div>
  </div>

  <div class="card">
    <h3>Товары (<span id="count">0</span>)</h3>
    <table id="productsTable">
      <thead>
        <tr>
          <th>№</th>
          <th>Наименование</th>
          <th>Кол-во</th>
          <th>Ед.</th>
          <th>Себестоимость</th>
          <th>Сумма</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    // ОШИБКА УСТРАНЕНА: Явное указание workerSrc
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    async function processPdf() {
      const fileInput = document.getElementById('pdfFile');
      const statusDiv = document.getElementById('status');
      const tbody = document.querySelector('#productsTable tbody');
      const countSpan = document.getElementById('count');

      tbody.innerHTML = '';
      countSpan.textContent = '0';

      if (!fileInput.files.length) {
        statusDiv.style.color = '#ef476f';
        statusDiv.textContent = 'Выберите PDF файл!';
        return;
      }

      statusDiv.style.color = '#ffd166';
      statusDiv.textContent = 'Обработка файла...';

      try {
        const file = fileInput.files[0];
        const arrayBuffer = await file.arrayBuffer();
        
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let fullText = '';

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          const textContent = await page.getTextContent();
          
          let lastY = null;
          let pageText = '';
          for (const item of textContent.items) {
            if (lastY !== null && Math.abs(item.transform[5] - lastY) > 5) {
              pageText += '\n';
            }
            pageText += item.str + ' ';
            lastY = item.transform[5];
          }
          fullText += pageText + '\n';
        }

        const products = parseProductsFromText(fullText);

        if (products.length === 0) {
          statusDiv.style.color = '#ef476f';
          statusDiv.textContent = 'Товары не найдены.';
          return;
        }

        statusDiv.style.color = '#06d6a0';
        statusDiv.textContent = `Успешно распознано: ${products.length} товаров`;
        countSpan.textContent = products.length;

        products.forEach(item => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${item.id}</td>
            <td>${item.title}</td>
            <td>${item.quantity}</td>
            <td>${item.unit}</td>
            <td><b>${item.cost_price.toFixed(2)} ₽</b></td>
            <td>${item.total_sum.toFixed(2)} ₽</td>
          `;
          tbody.appendChild(tr);
        });

      } catch (err) {
        console.error(err);
        statusDiv.style.color = '#ef476f';
        statusDiv.textContent = 'Ошибка: ' + err.message;
      }
    }

    function parseProductsFromText(text) {
      const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
      const products = [];
      const rowPattern = /^(?:\|\s*)?(\d+)\s+(.+?)\s*\|?\s*([\d\s\.,]+)\s*\|?\s*(\d+)\s*\|?\s*([а-яА-Яa-zA-Z]+|\b)\s*\|?\s*([\d\s\.,]+)/;

      let currentItem = null;

      for (let line of lines) {
        const cleanLine = line.replace(/^\|/, '').trim();
        const match = cleanLine.match(rowPattern);

        if (match) {
          if (currentItem) products.push(currentItem);
          
          const costPrice = parseFloat(match[3].replace(/\s/g, '').replace(',', '.'));
          const totalAmount = parseFloat(match[6].replace(/\s/g, '').replace(',', '.'));

          currentItem = {
            id: parseInt(match[1], 10),
            title: match[2].trim(),
            cost_price: costPrice,
            quantity: parseInt(match[4], 10),
            unit: match[5] || 'шт',
            total_sum: totalAmount
          };
        } else if (currentItem) {
          if (!line.includes('Итого') && !line.includes('ЗАКАЗ №') && !line.includes('Заказчик') && !line.includes('Наименование')) {
            if (!line.startsWith('|')) {
              currentItem.title += ' ' + line.trim();
            }
          }
        }
      }

      if (currentItem) products.push(currentItem);
      return products;
    }
  </script>
</body>
</html>
